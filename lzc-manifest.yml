application:
  subdomain: pictshare
  multi_instance: false
  upstreams:
    - location: /package-licenses/
      backend: file:///lzcapp/pkg/content/licenses/
    - location: /
      backend: http://pictshare:80/
services:
  pictshare:
    # upstream: hascheksolutions/pictshare:3.7.5
    image: docker.1ms.run/hascheksolutions/pictshare:3.7.5
    environment:
      - TZ=Asia/Shanghai
      - MAX_UPLOAD_SIZE=100
      # Random preset; empty would disable the admin panel entirely (airhand
      # precedent: "empty means no protection" vars must be forced random).
      - ADMIN_PASSWORD={{PASSWORD_admin_pw}}
    binds:
      - /lzcapp/var/mutdata/data:/app/public/data
      - /lzcapp/var/mutdata/logs:/app/public/logs
usage: |
  PictShare (AGPL-3.0) is a minimalist self-hosted media hosting service: upload images, videos and text to get shareable links; it supports automatic image resizing and format conversion.

  Usage:
  1. After opening the app, upload directly on the homepage (drag and drop or select a file), and you will get a shareable link.
  2. This app has no user account system, so public_path is not enabled, and the web entry is protected by platform authentication (same as the dufs/goshs precedent).
  3. The admin panel is at /admin, with the password being the "Admin Panel Password" preset at deployment (a random value, which can be viewed and modified in the deployment parameters); uploading requires an access code only if the "Upload Access Code" parameter is configured.

  Notes:
  - This package has not been verified on a real machine; please refer to the official documentation for functionality: https://github.com/HaschekSolutions/pictshare
  - Uploaded files are saved in /lzcapp/var/mutdata/data, and uninstalling the app will delete them; please back up regularly.
  - The license is AGPL-3.0, bundled with the package, see /package-licenses/.
